name: MYSFTP CI & Multi-Platform Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build MYSFTP (Android APK & Windows EXE)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Build Android Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Prepare Release Artifacts
      run: |
        mkdir -p build-artifacts
        cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/MYSFTP.apk
        cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/MYSFTP-v1.7.0.apk
        if [ -f "MYSFTP.exe" ]; then
          cp MYSFTP.exe build-artifacts/MYSFTP.exe
          cp MYSFTP.exe build-artifacts/MYSFTP-v1.7.0.exe
        fi

    - name: Upload APK Artifact (Actions Tab)
      uses: actions/upload-artifact@v4
      with:
        name: MYSFTP-v1.7.0-Build
        path: build-artifacts/

    - name: Create or Update GitHub Release
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.7.0' }}
        name: "MYSFTP v1.7.0 (Luxury Termius & Ultra-Fast SFTP Edition)"
        body: |
          ## 🌟 MYSFTP v1.7.0 — Luxury Termius & Ultra-Fast SFTP Edition by ZellRayy

          ### ✨ Pembaruan Utama v1.7.0:
          * 💻 **Native App Window Isolated Mode**: `MYSFTP.exe` berjalan dalam mode aplikasi mandiri (*standalone window*) tanpa toolbar browser atau framing Edge biasa.
          * ⚡ **Ultra-Fast & Smooth Remote Browsing**: File explorer kini dilengkapi *smart memory cache* dan penanganan error yang kuat. Navigasi folder tidak lagi delay atau reconnect berulang.
          * ◀ **Tombol Navigasi Diperbarui**: Tombol direktori induk kini bertuliskan **`◀ Kembali`** agar lebih intuitif dan rapi.
          * 💻 **SSH Termius Console (Full ANSI & Box Drawing)**:
            * Tampilan konsol Termius dengan font *JetBrains Mono*, warna ANSI 16/256 warna, dan rendering karakter tabel (`pm2 ls`, `htop`, `df -h`) yang lurus rapi.
            * Tombol **`🛑 Ctrl+C (Break)`** dan pintasan keyboard `Ctrl+C` untuk langsung menghentikan proses log/monitoring (`pm2 logs`, `ping`, `top`).
          * 📝 **Pro Code Editor**: Editor kode terintegrasi dengan pintasan `Ctrl+S` untuk menyimpan langsung ke server.

          ### 📦 File Unduhan Resmi:
          * 💻 **Windows PC / Laptop:** Unduh `MYSFTP.exe` (atau `MYSFTP-v1.7.0.exe`).
          * 📱 **HP Android:** Unduh `MYSFTP.apk` (atau `MYSFTP-v1.7.0.apk`).
        draft: false
        prerelease: false
        files: |
          build-artifacts/MYSFTP.apk
          build-artifacts/MYSFTP-v1.7.0.apk
          build-artifacts/MYSFTP.exe
          build-artifacts/MYSFTP-v1.7.0.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
