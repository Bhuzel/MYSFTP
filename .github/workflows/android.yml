name: MYSFTP CI & Multi-Platform Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build MYSFTP (Android APK & Windows EXE)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Build Android Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Prepare Release Artifacts
      run: |
        mkdir -p build-artifacts
        cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/MYSFTP.apk
        cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/MYSFTP-v1.0.0.apk
        if [ -f "MYSFTP.exe" ]; then
          cp MYSFTP.exe build-artifacts/MYSFTP.exe
        fi

    - name: Upload APK Artifact (Actions Tab)
      uses: actions/upload-artifact@v4
      with:
        name: MYSFTP-v1.0.0-Build
        path: build-artifacts/

    - name: Create or Update GitHub Release
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
        name: "MYSFTP v1.0.0 (Official Release)"
        body: "🌟 **MYSFTP v1.0.0 — Luxury Dark Edition** by ZellRayy.\n\n### 📦 File Unduhan:\n* 💻 **Windows PC / Laptop:** Unduh `MYSFTP.exe` (Aplikasi standalone portabel, tinggal klik ganda).\n* 📱 **HP Android:** Unduh `MYSFTP.apk` (Mendukung OTA Update otomatis)."
        draft: false
        prerelease: false
        files: |
          build-artifacts/MYSFTP.apk
          build-artifacts/MYSFTP-v1.0.0.apk
          build-artifacts/MYSFTP.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
