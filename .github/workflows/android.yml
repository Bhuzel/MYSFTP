name: MYSFTP CI & Multi-Platform Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build MYSFTP (Android APK & Windows EXE)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Build Android Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Prepare Release Artifacts
      run: |
        mkdir -p build-artifacts
        cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/MYSFTP.apk
        cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/MYSFTP-v1.8.0.apk
        if [ -f "MYSFTP.exe" ]; then
          cp MYSFTP.exe build-artifacts/MYSFTP.exe
          cp MYSFTP.exe build-artifacts/MYSFTP-v1.8.0.exe
        fi
        if [ -f "MYSFTP-Setup.exe" ]; then
          cp MYSFTP-Setup.exe build-artifacts/MYSFTP-Setup.exe
        fi

    - name: Upload APK Artifact (Actions Tab)
      uses: actions/upload-artifact@v4
      with:
        name: MYSFTP-v1.8.0-Build
        path: build-artifacts/

    - name: Create or Update GitHub Release
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.8.0' }}
        name: "MYSFTP v1.8.0 (Public Pro Edition — Real Termius & Local File Upload)"
        body: |
          ## 🌟 MYSFTP v1.8.0 — Public Pro Edition by ZellRayy

          ### ✨ Pembaruan Utama v1.8.0:
          * 💻 **Instant Standalone Window Startup**: Proses inisialisasi server lokal kini tersinkronisasi 100% sebelum jendela aplikasi dibuka, memastikan aplikasi langsung terbuka lancar pada klik pertama tanpa error.
          * 📤 **Fitur Unggah Berkas Lokal (Upload File)**: Tersedia tombol **`📤 Upload File`** di toolbar File Explorer untuk memilih berkas dari laptop/PC dan mengunggahnya langsung ke folder remote server VPS.
          * 💻 **SSH Termius Console Penuh**:
            * Eksekusi perintah Linux instan (`pm2 status`, `ls -la`, `df -h`, `free -m`, `htop`, dll).
            * Dukungan streaming realtime untuk `pm2 logs` dengan tombol **`🛑 Ctrl+C`** dan shortcut keyboard untuk menghentikan proses kapan saja.
          * ⚡ **Anti-Glitch Debounced Navigation**: Navigasi tombol **`◀ Kembali`** dan folder kini dilengkapi *navigation lock & top progress loader*, menghilangkan bug double-click atau delay.
          * 📝 **Pro Code Editor**: Terintegrasi langsung dengan shortcut `Ctrl+S`.

          ### 📦 File Unduhan Resmi:
          * 💻 **Windows PC / Laptop:** Unduh `MYSFTP.exe` (atau `MYSFTP-v1.8.0.exe`).
          * 📱 **HP Android:** Unduh `MYSFTP.apk` (atau `MYSFTP-v1.8.0.apk`).
        draft: false
        prerelease: false
        files: |
          build-artifacts/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
