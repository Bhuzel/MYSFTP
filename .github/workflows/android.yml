name: MYSFTP CI & Multi-Platform Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build MYSFTP (Android APK & Windows EXE)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Build Android Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Prepare Release Artifacts
      run: |
        mkdir -p build-artifacts
        cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/MYSFTP.apk
        cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/MYSFTP-v1.6.0.apk
        if [ -f "MYSFTP.exe" ]; then
          cp MYSFTP.exe build-artifacts/MYSFTP.exe
          cp MYSFTP.exe build-artifacts/MYSFTP-v1.6.0.exe
        fi

    - name: Upload APK Artifact (Actions Tab)
      uses: actions/upload-artifact@v4
      with:
        name: MYSFTP-v1.6.0-Build
        path: build-artifacts/

    - name: Create or Update GitHub Release
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.6.0' }}
        name: "MYSFTP v1.6.0 (Real SSH/SFTP Edition)"
        body: |
          ## 🚀 MYSFTP v1.6.0 — Real SSH/SFTP Edition by ZellRayy

          ### ✨ Pembaruan Utama v1.6.0
          * 🔐 **Login SSH Nyata**: Koneksi SFTP sekarang menggunakan `ssh.exe` bawaan Windows — bukan simulasi. Masukkan host, port, username, dan password, lalu terhubung ke VPS sungguhan.
          * 📁 **File Explorer Remote**: Menjelajahi folder dan file di server VPS/SFTP secara langsung (ls, cat, mkdir, rm via SSH).
          * 💻 **Terminal SSH Interaktif**: Terminal real-time yang langsung stream output dari server remote. Mendukung semua perintah Linux.
          * ✏️ **Code Editor Remote**: Buka dan edit file langsung di server, simpan kembali via SSH.
          * 🗂️ **Default Kosong**: Tidak ada profil bawaan — mulai bersih dan tambah servermu sendiri.
          * 💎 **Luxury Glassmorphism UI**: Dark gold theme dengan Outfit, Inter & JetBrains Mono fonts.

          ### 📦 File Unduhan
          * 💻 **Windows PC/Laptop:** `MYSFTP.exe` atau `MYSFTP-v1.6.0.exe` — klik 2x, langsung jalan.
          * 📱 **HP Android:** `MYSFTP.apk` atau `MYSFTP-v1.6.0.apk`
        draft: false
        prerelease: false
        files: |
          build-artifacts/MYSFTP.apk
          build-artifacts/MYSFTP-v1.6.0.apk
          build-artifacts/MYSFTP.exe
          build-artifacts/MYSFTP-v1.6.0.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
