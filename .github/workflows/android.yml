name: MYSFTP CI & Multi-Platform Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build MYSFTP (Android APK & Windows EXE)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Build Android Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Prepare Release Artifacts
      run: |
        mkdir -p build-artifacts
        cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/MYSFTP.apk
        cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/MYSFTP-v1.4.0.apk
        if [ -f "MYSFTP.exe" ]; then
          cp MYSFTP.exe build-artifacts/MYSFTP.exe
          cp MYSFTP.exe build-artifacts/MYSFTP-v1.4.0.exe
        fi

    - name: Upload APK Artifact (Actions Tab)
      uses: actions/upload-artifact@v4
      with:
        name: MYSFTP-v1.4.0-Build
        path: build-artifacts/

    - name: Create or Update GitHub Release
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.4.0' }}
        name: "MYSFTP v1.4.0 (Desktop Native & Android Pro Release)"
        body: "🌟 **MYSFTP v1.4.0 — Desktop Native & Android Pro Edition** by ZellRayy.\n\n### ✨ Pembaruan Utama v1.4.0:\n* 🖥️ **Windows Desktop Native Overhaul (`MYSFTP.exe`)**: Dibuat 100% menggunakan Native Windows Controls dengan performa super instan, dark gold theme murni, tanpa kendala browser IE/blank screen!\n* 🎨 **Official Windows Icon**: Ikon resmi `app.ico` (dari `Icon.jpg`) telah tertanam permanen di dalam file `.exe`, taskbar, dan header aplikasi.\n* 📱 **Android Code Editor Routing**: Berkas `package.json`, `.sql`, `.xml`, `.env` otomatis terbuka di Pro Code Editor.\n* 📂 **Folder Navigation Retention**: Navigasi kembali dari editor file tetap mempertahankan direktori folder aktif tanpa ter-reset ke root.\n* 💻 **SSH Terminal Termius Experience**: Fitur drag-select salin teks, zoom-in horizontal scrolling, dan sesi yang tidak pernah putus saat keluar-masuk terminal.\n\n### 📦 File Unduhan Resmi:\n* 💻 **Windows PC / Laptop:** Unduh `MYSFTP.exe` (atau `MYSFTP-v1.4.0.exe`). Tinggal klik 2x langsung terbuka.\n* 📱 **HP Android:** Unduh `MYSFTP.apk` (atau `MYSFTP-v1.4.0.apk`)."
        draft: false
        prerelease: false
        files: |
          build-artifacts/MYSFTP.apk
          build-artifacts/MYSFTP-v1.4.0.apk
          build-artifacts/MYSFTP.exe
          build-artifacts/MYSFTP-v1.4.0.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
