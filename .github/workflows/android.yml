name: MYSFTP CI & Multi-Platform Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build MYSFTP (Android APK & Windows EXE)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Build Android Debug APK
      run: ./gradlew assembleDebug

    - name: Prepare Release Artifacts
      run: |
        mkdir -p build-artifacts
        cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/MYSFTP.apk
        cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/MYSFTP-v1.0.0.apk
        if [ -f "MYSFTP.exe" ]; then
          cp MYSFTP.exe build-artifacts/MYSFTP.exe
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MYSFTP-APK
        path: build-artifacts/MYSFTP.apk

    - name: Create or Update GitHub Release
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          TAG_NAME="${{ github.ref_name }}"
          RELEASE_TITLE="MYSFTP Release $TAG_NAME"
          PRERELEASE_FLAG=""
        else
          TAG_NAME="v1.0.0"
          RELEASE_TITLE="MYSFTP v1.0.0 (Official Release)"
          PRERELEASE_FLAG=""
          
          # Hapus rilis & tag lama jika ada agar selalu fresh
          gh release delete "$TAG_NAME" --cleanup-tag --yes || true
        fi
        
        # Kumpulkan semua aset release yang ada
        RELEASE_FILES="build-artifacts/MYSFTP.apk build-artifacts/MYSFTP-v1.0.0.apk"
        if [ -f "build-artifacts/MYSFTP.exe" ]; then
          RELEASE_FILES="$RELEASE_FILES build-artifacts/MYSFTP.exe"
        fi

        # Buat rilis baru di GitHub
        gh release create "$TAG_NAME" \
          --title "$RELEASE_TITLE" \
          $PRERELEASE_FLAG \
          --notes "🌟 **MYSFTP v1.0.0 — Luxury Dark Edition** by ZellRayy. Rilis multi-platform: Unduh **MYSFTP.apk** untuk Android dan **MYSFTP.exe** untuk Windows PC / Laptop." \
          $RELEASE_FILES
