name: MYSFTP CI & Multi-Platform Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build MYSFTP (Android APK & Windows EXE)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Build Android Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Prepare Release Artifacts
      run: |
        mkdir -p build-artifacts
        cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/MYSFTP.apk
        cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/MYSFTP-v1.5.0.apk
        if [ -f "MYSFTP.exe" ]; then
          cp MYSFTP.exe build-artifacts/MYSFTP.exe
          cp MYSFTP.exe build-artifacts/MYSFTP-v1.5.0.exe
        fi

    - name: Upload APK Artifact (Actions Tab)
      uses: actions/upload-artifact@v4
      with:
        name: MYSFTP-v1.5.0-Build
        path: build-artifacts/

    - name: Create or Update GitHub Release
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.5.0' }}
        name: "MYSFTP v1.5.0 (Luxury Glassmorphism Edition)"
        body: "🌟 **MYSFTP v1.5.0 — Luxury Glassmorphism Edition** by ZellRayy.\n\n### ✨ Pembaruan Utama v1.5.0:\n* 💎 **Ultra Luxury Desktop Client (`MYSFTP.exe`)**: Tampilan PC sekarang 100% identik dengan gaya aplikasi Android dan website modern (Outfit & Inter fonts, Glassmorphism, radial glow, responsive server cards).\n* 🚀 **Koneksi Remote Server Sebenarnya**: Menekan tombol '🚀 Buka' pada server profil (misal `VPS 2` `root@163.172.110.146:2277`) langsung menghubungkan sesi explorer ke server tersebut.\n* 💻 **SSH Terminal Termius Console**: Konsol interaktif lengkap dengan prompt `root@server:~#`, pintasan cepat (`pm2 status`, `df -h`, `free -m`, `uptime`), serta seleksi teks untuk salin.\n* 📝 **Pro Code Editor**: Editor kode modern dengan tab berkas, font monospace JetBrains Mono, dan pintasan `Ctrl+S`.\n* 🎨 **Embedded Icon**: Ikon resmi `app.ico` tertanam langsung di file `.exe` dan taskbar.\n\n### 📦 File Unduhan Resmi:\n* 💻 **Windows PC / Laptop:** Unduh `MYSFTP.exe` (atau `MYSFTP-v1.5.0.exe`). Tinggal klik 2x langsung terbuka.\n* 📱 **HP Android:** Unduh `MYSFTP.apk` (atau `MYSFTP-v1.5.0.apk`)."
        draft: false
        prerelease: false
        files: |
          build-artifacts/MYSFTP.apk
          build-artifacts/MYSFTP-v1.5.0.apk
          build-artifacts/MYSFTP.exe
          build-artifacts/MYSFTP-v1.5.0.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
